[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpilot-backend"
version = "0.1.0"
description = "PaperPilot FastAPI and LangGraph backend"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "chromadb>=1.1,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "pymupdf>=1.26,<2",
  "pypdf>=6,<7",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
reranker = [
  "sentence-transformers>=5,<6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Keep the pytest temp root inside the repository (gitignored) so the documented
# command works on hosts where the system temp directory is not writable.
addopts = "--basetemp=.pytest-tmp"
