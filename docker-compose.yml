services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/paperpilot.db
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - paperpilot-data:/data

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  paperpilot-data:
